<!DOCTYPE html>
<!--
  P1 · 深蓝紫仪表盘（PC 性能监控）
  画面：4 张 KPI 卡（CPU / GPU / 内存 / 磁盘）+ 风扇转速 / 系统温度。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P1 · 系统仪表盘</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden;
    background: #101426;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: block;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 主题：深蓝紫 ---- */
  #img {
    background:
      radial-gradient(circle at 88% 6%, rgba(168,85,247,.20) 0%, transparent 50%),
      radial-gradient(circle at 6% 92%, rgba(124,140,255,.16) 0%, transparent 50%),
      linear-gradient(165deg, #101426 0%, #151a33 100%);
  }
  .card { position: absolute; border-radius: 6px; background: #1a2038;
          border: 1px solid rgba(124,140,255,.24); }
  .panel { position: absolute; border-radius: 6px; background: rgba(26,32,56,.72);
           border: 1px solid rgba(124,140,255,.20); }
  /* 柱状图容器：把基线钉在 190（否则 bottom:0 会贴到整页 240 底、压住底部文字） */
  .chart { position: absolute; left: 20px; top: 118px; width: 284px; height: 72px; }
  .barv { position: absolute; bottom: 0; width: 22px; border-radius: 3px 3px 0 0;
          background: linear-gradient(180deg, #a855f7, #7c8cff);
          transform-origin: 50% 100%;
          animation: eq 1.15s ease-in-out infinite; }
  @keyframes eq { 0%,100%{transform:scaleY(.22)} 50%{transform:scaleY(1)} }
  .base { position: absolute; left: 20px; width: 284px; height: 1px;
          background: rgba(124,140,255,.30); }
  .led { position: absolute; width: 7px; height: 7px; border-radius: 50%;
         background: #a855f7; box-shadow: 0 0 8px #a855f7;
         animation: ledp 1.3s ease-in-out infinite; }
  @keyframes ledp { 0%,100%{opacity:.3;transform:scale(.75)} 50%{opacity:1;transform:scale(1)} }
  .bar-track { position: absolute; height: 5px; border-radius: 3px; background: #232a48; }
  .bar { position: absolute; left: 0; top: 0; height: 5px; border-radius: 3px;
         background: linear-gradient(90deg, #7c8cff, #a855f7); transition: none; }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 12px; font-weight: 700; color: #d9ddff; letter-spacing: 1px; }
  .cap { font-size: 10px; color: #9aa2d2; }
  .big { font-size: 20px; font-weight: 700; color: #f0f2ff; }
  .core{ font-size: 10px; color: #a3abdd; }
  .warn   { color: #fbbf24 !important; }
  .danger { color: #f87171 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="card" style="left:8px;top:32px;width:71px;height:54px;"></div>
    <div class="card" style="left:85px;top:32px;width:71px;height:54px;"></div>
    <div class="card" style="left:162px;top:32px;width:71px;height:54px;"></div>
    <div class="card" style="left:239px;top:32px;width:71px;height:54px;"></div>

    <div class="base" style="top:190px;"></div>

    <div class="led" style="left:296px;top:10px;"></div>
    <div class="bar-track" style="left:164px;top:206px;width:52px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:12px;top:9px;">系统仪表盘 SYSTEM DASHBOARD</span>

    <span class="txt cap" style="left:16px;top:40px;">CPU</span>
    <span class="txt big" data-slot="cpu_load" style="left:16px;top:54px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>

    <span class="txt cap" style="left:93px;top:40px;">GPU</span>
    <span class="txt big" data-slot="gpu1_load" style="left:93px;top:54px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>

    <span class="txt cap" style="left:170px;top:40px;">内存 MEM</span>
    <span class="txt big" data-slot="mem_pct" style="left:170px;top:54px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>

    <span class="txt cap" style="left:247px;top:40px;">磁盘 DISK</span>
    <span class="txt big" data-slot="disk1_pct" style="left:247px;top:54px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>

    
    
    
    
    
    
    
    
    

    <span class="txt cap" style="left:12px;top:206px;">风扇 FAN</span>
    <span class="txt cap" style="left:230px;top:206px;">温度 TEMP</span>

    <span class="txt cap" data-slot="fan1" style="left:84px;top:206px;color:#d9ddff;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>
    <span class="txt cap" data-slot="cpu_temp" style="left:290px;top:206px;color:#d9ddff;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>

    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_temp" data-max="100" data-box="164,206,52,5" style="left:164px;top:206px;width:0;"></div>
    <span class="txt cap" style="left:12px;top:224px;">实时采样 · 每 0.5 秒刷新 / refresh 0.5s</span>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  function fmt(spec, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var dec = spec.getAttribute('data-fmt');
    var s = (dec === null) ? String(raw) : v.toFixed(parseInt(dec, 10));
    if (spec.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (spec.getAttribute('data-suffix') || '');
  }
  function thresholds(spec) {
    var w = spec.getAttribute('data-warn'), d = spec.getAttribute('data-danger');
    if (w === null && d === null && spec.getAttribute('data-from')) {
      var src = document.querySelector('[data-slot="' + spec.getAttribute('data-from') + '"]');
      if (src) { w = src.getAttribute('data-warn'); d = src.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), d === null ? null : parseFloat(d)];
  }
  function paint(spec, raw) {
    var v = parseFloat(raw), th = thresholds(spec);
    spec.classList.toggle('warn',   th[0] !== null && v >= th[0] && !(th[1] !== null && v >= th[1]));
    spec.classList.toggle('danger', th[1] !== null && v >= th[1]);
  }
  function setBar(spec, raw) {
    var v = parseFloat(raw), max = parseFloat(spec.getAttribute('data-max') || '100');
    var box = (spec.getAttribute('data-box') || '0,0,100,4').split(',');
    spec.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / max)) * parseFloat(box[2])) + 'px';
    paint(spec, raw);
  }
  window.__setSlot = function (name, value) {
    var specs = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < specs.length; i++) {
      var el = specs[i];
      if (el.getAttribute('data-kind') === 'bar') { setBar(el, value); continue; }
      el.textContent = fmt(el, value);
      paint(el, value);
    }
    var bars = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bars.length; j++) setBar(bars[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('gpu1_load', '63'); window.__setSlot('mem_pct', '71');
  window.__setSlot('disk1_pct', '55'); window.__setSlot('fan1', '1420'); window.__setSlot('cpu_temp', '58');
  q.forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p1_dash",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_temp",
      "max": 100
    }
  ]
}
</script>
</body>
</html>
