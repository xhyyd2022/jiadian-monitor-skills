<!DOCTYPE html>
<!--
  P10 · 绿色磷光终端（PC 性能监控）
  画面：等宽字体 + 段式进度条（重复渐变拼「格子」）+ 一枚闪烁光标。
  自身取舍：数值统一右锚定到同一右边缘，位数变化不参差；动效只有光标，重绘面积很小。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P10 · 终端</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden; display: block;
    background: #050a06;
    font-family: "Consolas", "Courier New", "Microsoft YaHei", monospace;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 底：近黑 + 极淡的磷光晕 ---- */
  #img { background:
           radial-gradient(ellipse at 50% 0%, rgba(40,160,90,.16) 0%, rgba(40,160,90,0) 62%),
           #050a06; }
  .rule { position: absolute; height: 1px;
          background: repeating-linear-gradient(90deg,
            rgba(77,255,136,.55) 0 4px, rgba(77,255,136,0) 4px 8px); }
  .bar-track { position: absolute; height: 10px; background: #0d2a19;
               box-shadow: inset 0 0 0 1px rgba(77,255,136,.28); }
  .bar { position: absolute; left: 0; top: 0; height: 10px;
         background: repeating-linear-gradient(90deg,
           #4dff88 0 4px, #2fbf60 4px 7px, #0d2a19 7px 8px); }
  .cur { position: absolute; width: 8px; height: 12px; background: #4dff88;
         animation: blink 1.1s steps(1,end) infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 12px; font-weight: 700; color: #4dff88; letter-spacing: 1px; }
  .lbl { font-size: 12px; font-weight: 700; color: #2fbf60; }
  .brk { font-size: 12px; color: #2fbf60; }
  .num { font-size: 12px; font-weight: 700; color: #4dff88; }
  .foot{ font-size: 12px; color: #2fbf60; }
  .log { font-size: 12px; color: #2fbf60; }
  .warn   { color: #ffcc33 !important; }
  .danger { color: #ff5c5c !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="rule" style="left:14px;top:30px;width:292px;"></div>
    <div class="rule" style="left:14px;top:160px;width:292px;"></div>

    <div class="bar-track" style="left:64px;top:47px;width:188px;"></div>
    <div class="bar-track" style="left:64px;top:77px;width:188px;"></div>
    <div class="bar-track" style="left:64px;top:107px;width:188px;"></div>
    <div class="bar-track" style="left:64px;top:137px;width:188px;"></div>

    <div class="cur" style="left:196px;top:204px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:14px;top:13px;">PCMON 系统监视 · SYSTEM MONITOR</span>

    <span class="txt lbl" style="left:14px;top:46px;">CPU</span>
    <span class="txt brk" style="left:56px;top:46px;">[</span>
    <span class="txt brk" style="left:256px;top:46px;">]</span>
    <span class="txt num" data-slot="cpu_load" style="right:14px;top:46px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="64,47,188,10" style="left:64px;top:47px;width:0;"></div>

    <span class="txt lbl" style="left:14px;top:76px;">MEM</span>
    <span class="txt brk" style="left:56px;top:76px;">[</span>
    <span class="txt brk" style="left:256px;top:76px;">]</span>
    <span class="txt num" data-slot="mem_pct" style="right:14px;top:76px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <div class="bar" data-slot="bar2" data-kind="bar" data-from="mem_pct" data-max="100" data-box="64,77,188,10" style="left:64px;top:77px;width:0;"></div>

    <span class="txt lbl" style="left:14px;top:106px;">DISK</span>
    <span class="txt brk" style="left:56px;top:106px;">[</span>
    <span class="txt brk" style="left:256px;top:106px;">]</span>
    <span class="txt num" data-slot="disk1_pct" style="right:14px;top:106px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>
    <div class="bar" data-slot="bar3" data-kind="bar" data-from="disk1_pct" data-max="100" data-box="64,107,188,10" style="left:64px;top:107px;width:0;"></div>

    <span class="txt lbl" style="left:14px;top:136px;">GPU</span>
    <span class="txt brk" style="left:56px;top:136px;">[</span>
    <span class="txt brk" style="left:256px;top:136px;">]</span>
    <span class="txt num" data-slot="gpu1_load" style="right:14px;top:136px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>
    <div class="bar" data-slot="bar4" data-kind="bar" data-from="gpu1_load" data-max="100" data-box="64,137,188,10" style="left:64px;top:137px;width:0;"></div>

    <span class="txt foot" style="left:14px;top:178px;">温度 TEMP</span>
    <span class="txt num" data-slot="cpu_temp" style="left:104px;top:178px;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>

    <span class="txt foot" style="left:168px;top:178px;">风扇 FAN</span>
    <span class="txt num" data-slot="fan1" style="left:242px;top:178px;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>

    <span class="txt log" style="left:14px;top:204px;">&gt; 采样 0.5s · 传感器正常</span>
  </div>
</div>

<script>
(function () {
  function tx(el, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var d = el.getAttribute('data-fmt');
    var s = (d === null) ? String(raw) : v.toFixed(parseInt(d, 10));
    if (el.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (el.getAttribute('data-suffix') || '');
  }
  function th(el) {
    var w = el.getAttribute('data-warn'), g = el.getAttribute('data-danger');
    if (w === null && g === null && el.getAttribute('data-from')) {
      var s = document.querySelector('[data-slot="' + el.getAttribute('data-from') + '"]');
      if (s) { w = s.getAttribute('data-warn'); g = s.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), g === null ? null : parseFloat(g)];
  }
  function cl(el, raw) {
    var v = parseFloat(raw), t = th(el);
    el.classList.toggle('warn',   t[0] !== null && v >= t[0] && !(t[1] !== null && v >= t[1]));
    el.classList.toggle('danger', t[1] !== null && v >= t[1]);
  }
  function bar(el, raw) {
    var v = parseFloat(raw), m = parseFloat(el.getAttribute('data-max') || '100');
    var b = (el.getAttribute('data-box') || '0,0,100,4').split(',');
    el.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / m)) * parseFloat(b[2])) + 'px';
    cl(el, raw);
  }
  window.__setSlot = function (name, value) {
    var sp = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].getAttribute('data-kind') === 'bar') { bar(sp[i], value); continue; }
      sp[i].textContent = tx(sp[i], value); cl(sp[i], value);
    }
    var bs = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bs.length; j++) bar(bs[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('disk1_pct', '55');
  window.__setSlot('gpu1_load', '63'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  new URLSearchParams(location.search).forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p10_terminal",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar2",
      "kind": "bar",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar3",
      "kind": "bar",
      "from": "disk1_pct",
      "max": 100
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar4",
      "kind": "bar",
      "from": "gpu1_load",
      "max": 100
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
