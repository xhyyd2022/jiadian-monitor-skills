<!DOCTYPE html>
<!--
  P2 · 深青军规「分段格子条」（PC 性能监控）
  画面：CPU / GPU / 内存 / 磁盘。
  自身取舍：进度是「逐格点亮」的段式条（data-kind="seg"），不是连续宽度条。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P2 · 分段格子条</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden;
    background: #061418;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    display: block;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 主题：深青军规 ---- */
  #img {
    background:
      radial-gradient(circle at 50% 0%, rgba(34,211,238,.14) 0%, transparent 55%),
      linear-gradient(180deg, #061418 0%, #04100f 100%);
  }
  #img::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg,
      rgba(34,211,238,.05) 0 1px, transparent 1px 4px);
  }
  .rule { position: absolute; left: 12px; width: 296px; height: 1px;
          background: rgba(34,211,238,.30); }
  .segbar { position: absolute; height: 8px; }
  .segbar i { position: absolute; top: 0; width: 15px; height: 8px; border-radius: 2px;
              background: rgba(34,211,238,.14); }
  .segbar i.on { background: #22d3ee; }
  .segbar i.on.w { background: #fbbf24; }
  .segbar i.on.d { background: #f87171; }
  .scan { position: absolute; left: 0; top: 0; width: 320px; height: 2px; opacity: .35;
          background: linear-gradient(90deg, transparent, #22d3ee, transparent);
          animation: scan 2.8s linear infinite; }
  @keyframes scan { 0%{top:0px} 100%{top:238px} }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 12px; font-weight: 700; color: #7dd3fc; letter-spacing: 3px; }
  .lbl { font-size: 11px; color: #67e8f9; letter-spacing: 1px; }
  .val { font-size: 17px; font-weight: 700; color: #e0fbff; }
  .unit{ font-size: 11px; color: #7fb8c9; }
  .foot{ font-size: 11px; color: #7fb8c9; letter-spacing: 1px; }
  .warn   { color: #fbbf24 !important; }
  .danger { color: #f87171 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="rule" style="top:30px;"></div>
    <div class="rule" style="top:206px;"></div>
    <div class="scan"></div>

    <div class="segbar" data-slot="bar1" data-kind="seg" data-from="cpu_load" data-max="100" data-box="12,54,288,8" style="left:12px;top:54px;">
      <i style="left:0px"></i><i style="left:18px"></i><i style="left:36px"></i><i style="left:54px"></i>
      <i style="left:72px"></i><i style="left:90px"></i><i style="left:108px"></i><i style="left:126px"></i>
      <i style="left:144px"></i><i style="left:162px"></i><i style="left:180px"></i><i style="left:198px"></i>
      <i style="left:216px"></i><i style="left:234px"></i><i style="left:252px"></i><i style="left:270px"></i>
    </div>

    <div class="segbar" data-slot="bar2" data-kind="seg" data-from="gpu1_load" data-max="100" data-box="12,98,288,8" style="left:12px;top:98px;">
      <i style="left:0px"></i><i style="left:18px"></i><i style="left:36px"></i><i style="left:54px"></i>
      <i style="left:72px"></i><i style="left:90px"></i><i style="left:108px"></i><i style="left:126px"></i>
      <i style="left:144px"></i><i style="left:162px"></i><i style="left:180px"></i><i style="left:198px"></i>
      <i style="left:216px"></i><i style="left:234px"></i><i style="left:252px"></i><i style="left:270px"></i>
    </div>

    <div class="segbar" data-slot="bar3" data-kind="seg" data-from="mem_pct" data-max="100" data-box="12,142,288,8" style="left:12px;top:142px;">
      <i style="left:0px"></i><i style="left:18px"></i><i style="left:36px"></i><i style="left:54px"></i>
      <i style="left:72px"></i><i style="left:90px"></i><i style="left:108px"></i><i style="left:126px"></i>
      <i style="left:144px"></i><i style="left:162px"></i><i style="left:180px"></i><i style="left:198px"></i>
      <i style="left:216px"></i><i style="left:234px"></i><i style="left:252px"></i><i style="left:270px"></i>
    </div>

    <div class="segbar" data-slot="bar4" data-kind="seg" data-from="disk1_pct" data-max="100" data-box="12,186,288,8" style="left:12px;top:186px;">
      <i style="left:0px"></i><i style="left:18px"></i><i style="left:36px"></i><i style="left:54px"></i>
      <i style="left:72px"></i><i style="left:90px"></i><i style="left:108px"></i><i style="left:126px"></i>
      <i style="left:144px"></i><i style="left:162px"></i><i style="left:180px"></i><i style="left:198px"></i>
      <i style="left:216px"></i><i style="left:234px"></i><i style="left:252px"></i><i style="left:270px"></i>
    </div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:12px;top:10px;">SYS.MONITOR 系统监控</span>

    <span class="txt lbl" style="left:12px;top:38px;">CPU 处理器</span>
    <span class="txt val" data-slot="cpu_load" style="left:246px;top:35px;" data-fmt="0" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <span class="txt unit" style="left:290px;top:40px;">%</span>

    <span class="txt lbl" style="left:12px;top:82px;">GPU 显卡</span>
    <span class="txt val" data-slot="gpu1_load" style="left:246px;top:79px;" data-fmt="0" data-warn="80" data-danger="92">{{gpu1_load}}</span>
    <span class="txt unit" style="left:290px;top:84px;">%</span>

    <span class="txt lbl" style="left:12px;top:126px;">MEM 内存</span>
    <span class="txt val" data-slot="mem_pct" style="left:246px;top:123px;" data-fmt="0" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <span class="txt unit" style="left:290px;top:128px;">%</span>

    <span class="txt lbl" style="left:12px;top:170px;">DISK 磁盘</span>
    <span class="txt val" data-slot="disk1_pct" style="left:246px;top:167px;" data-fmt="0" data-warn="85">{{disk1_pct}}</span>
    <span class="txt unit" style="left:290px;top:172px;">%</span>

    <span class="txt foot" style="left:12px;top:214px;">每格 = 6.25%</span>
    <span class="txt foot" style="left:170px;top:214px;">SAMPLE 0.5s</span>
    <span class="txt foot" style="left:270px;top:214px;">LIVE</span>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  function fmt(spec, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var dec = spec.getAttribute('data-fmt');
    var s = (dec === null) ? String(raw) : v.toFixed(parseInt(dec, 10));
    if (spec.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (spec.getAttribute('data-suffix') || '');
  }
  function thresholds(spec) {
    var w = spec.getAttribute('data-warn'), d = spec.getAttribute('data-danger');
    if (w === null && d === null && spec.getAttribute('data-from')) {
      var src = document.querySelector('[data-slot="' + spec.getAttribute('data-from') + '"]');
      if (src) { w = src.getAttribute('data-warn'); d = src.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), d === null ? null : parseFloat(d)];
  }
  function paint(spec, raw) {
    var v = parseFloat(raw), th = thresholds(spec);
    spec.classList.toggle('warn',   th[0] !== null && v >= th[0] && !(th[1] !== null && v >= th[1]));
    spec.classList.toggle('danger', th[1] !== null && v >= th[1]);
  }
  /* 段式条：按比例点亮前 N 格 */
  function setSeg(spec, raw) {
    var v = parseFloat(raw), max = parseFloat(spec.getAttribute('data-max') || '100');
    var segs = spec.children, n = segs.length, i;
    var th = thresholds(spec);
    var lit = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / max)) * n);
    for (i = 0; i < n; i++) {
      if (i < lit) {
        segs[i].className = 'on' + (th[1] !== null && v >= th[1] ? ' d'
                                  : (th[0] !== null && v >= th[0] ? ' w' : ''));
      } else {
        segs[i].className = '';
      }
    }
    paint(spec, raw);
  }
  window.__setSlot = function (name, value) {
    var specs = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < specs.length; i++) {
      var el = specs[i];
      if (el.getAttribute('data-kind') === 'seg') { setSeg(el, value); continue; }
      el.textContent = fmt(el, value);
      paint(el, value);
    }
    var bars = document.querySelectorAll('[data-kind="seg"][data-from="' + name + '"]');
    for (var j = 0; j < bars.length; j++) setSeg(bars[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('gpu1_load', '63');
  window.__setSlot('mem_pct', '71'); window.__setSlot('disk1_pct', '55');
  q.forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p2_seg_hud",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "bar1",
      "kind": "seg",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "bar2",
      "kind": "seg",
      "from": "gpu1_load",
      "max": 100
    },
    {
      "name": "bar3",
      "kind": "seg",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "bar4",
      "kind": "seg",
      "from": "disk1_pct",
      "max": 100
    },
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0
    }
  ]
}
</script>
</body>
</html>
