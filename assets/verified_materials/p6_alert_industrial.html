<!DOCTYPE html>
<!--
  P6 · 黑底荧光黄「工业警示风」（PC 性能监控）
  画面：超大主数值 + 危险斜条纹带；CPU / 内存 / 磁盘 / GPU + 温度 / 风扇。
  自身取舍：文字一律不进条纹带 —— 进带会被图案吃掉对比度。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P6 · 警示风</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden;
    background: #0a0a08;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: block;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 主题：黑底荧光黄警示 ---- */
  #img { background: #0a0a08; }
  .hazard { position: absolute; left: 0; width: 320px;
            background: repeating-linear-gradient(45deg,
              #ffe000 0 10px, #1a1a10 10px 20px); }
  .panel { position: absolute; left: 8px; border: 2px solid #ffe000; background: #100f0a; }
  .bar-track { position: absolute; height: 8px; background: #2a2818; border: 1px solid #554f22; }
  .bar { position: absolute; left: 1px; top: 1px; height: 6px;
         background: #ffe000; transition: none; }
  .lamp { position: absolute; width: 12px; height: 12px; border-radius: 50%;
          background: #ff4d3d; box-shadow: 0 0 10px #ff4d3d;
          animation: warn 0.9s steps(1,end) infinite; }
  @keyframes warn { 0%,49%{opacity:1} 50%,100%{opacity:.15} }
  .cell { position: absolute; height: 40px; border-left: 3px solid #ffe000;
          background: rgba(255,224,0,.06); }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .band{ font-size: 13px; font-weight: 700; color: #ffe000; letter-spacing: 3px; }
  .huge{ font-size: 62px; font-weight: 700; color: #ffe000;
         text-shadow: 0 0 16px rgba(255,224,0,.45); }
  .cap { font-size: 11px; font-weight: 700; color: #d8c64a; letter-spacing: 2px; }
  .unit{ font-size: 12px; color: #b3a345; }
  .rl  { font-size: 11px; color: #cbb95a; }
  .rv  { font-size: 16px; font-weight: 700; color: #ffe000; }
  .foot{ font-size: 11px; color: #bfab52; }
  .warn   { color: #ff9f1a !important; }
  .danger { color: #ff4d3d !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="hazard" style="top:0;height:14px;"></div>
    <div class="hazard" style="top:224px;height:16px;"></div>

    <div class="panel" style="top:36px;width:304px;height:168px;"></div>
    <div class="lamp" style="left:288px;top:44px;"></div>

    <div class="bar-track" style="left:20px;top:132px;width:280px;"></div>

    <div class="cell" style="left:16px;top:152px;width:96px;"></div>
    <div class="cell" style="left:116px;top:152px;width:96px;"></div>
    <div class="cell" style="left:216px;top:152px;width:96px;"></div>
  </div>

  <div id="text">
    <span class="txt band" style="left:12px;top:17px;">⚠ 性能告警 · ALERT</span>

    <span class="txt cap" style="left:20px;top:44px;">CPU 占用 / LOAD</span>
    <span class="txt huge" data-slot="cpu_load" style="left:18px;top:56px;" data-fmt="0" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <span class="txt unit" style="right:24px;top:108px;">%</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="20,132,278,6" style="left:21px;top:133px;width:0;"></div>

    <span class="txt rl" style="left:24px;top:160px;">内存 MEM</span>
    <span class="txt rv" data-slot="mem_pct" style="left:24px;top:174px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>

    <span class="txt rl" style="left:124px;top:160px;">磁盘 DISK</span>
    <span class="txt rv" data-slot="disk1_pct" style="left:124px;top:174px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>

    <span class="txt rl" style="left:224px;top:160px;">GPU</span>
    <span class="txt rv" data-slot="gpu1_load" style="left:224px;top:174px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>

    <span class="txt foot" style="left:12px;top:208px;">TEMP 温度</span>
    <span class="txt foot" data-slot="cpu_temp" style="left:100px;top:208px;color:#ffe000;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>
    <span class="txt foot" style="left:170px;top:208px;">FAN 风扇</span>
    <span class="txt foot" data-slot="fan1" style="left:248px;top:208px;color:#ffe000;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  function fmt(spec, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var dec = spec.getAttribute('data-fmt');
    var s = (dec === null) ? String(raw) : v.toFixed(parseInt(dec, 10));
    if (spec.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (spec.getAttribute('data-suffix') || '');
  }
  function thresholds(spec) {
    var w = spec.getAttribute('data-warn'), d = spec.getAttribute('data-danger');
    if (w === null && d === null && spec.getAttribute('data-from')) {
      var src = document.querySelector('[data-slot="' + spec.getAttribute('data-from') + '"]');
      if (src) { w = src.getAttribute('data-warn'); d = src.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), d === null ? null : parseFloat(d)];
  }
  function paint(spec, raw) {
    var v = parseFloat(raw), th = thresholds(spec);
    spec.classList.toggle('warn',   th[0] !== null && v >= th[0] && !(th[1] !== null && v >= th[1]));
    spec.classList.toggle('danger', th[1] !== null && v >= th[1]);
  }
  function setBar(spec, raw) {
    var v = parseFloat(raw), max = parseFloat(spec.getAttribute('data-max') || '100');
    var box = (spec.getAttribute('data-box') || '0,0,100,4').split(',');
    spec.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / max)) * parseFloat(box[2])) + 'px';
    paint(spec, raw);
  }
  window.__setSlot = function (name, value) {
    var specs = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < specs.length; i++) {
      var el = specs[i];
      if (el.getAttribute('data-kind') === 'bar') { setBar(el, value); continue; }
      el.textContent = fmt(el, value);
      paint(el, value);
    }
    var bars = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bars.length; j++) setBar(bars[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('disk1_pct', '55');
  window.__setSlot('gpu1_load', '63'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  q.forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p6_alert_industrial",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
