<!DOCTYPE html>
<!--
  P8 · 玻璃拟态 Glassmorphism（PC 性能监控）
  画面：三张玻璃卡（CPU / 内存 / GPU）+ 底部玻璃条（网络 / 温度 / 风扇）。
  自身取舍：玻璃感 = 分层半透明 + 高光描边 + 柔和外阴影 + 背景光斑，不用 backdrop-filter。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P8 · 玻璃拟态</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden; display: block;
    background: #191338;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 底：深靛渐变 + 三团光斑（给玻璃提供"背后有东西"的层次） ---- */
  #img { background: linear-gradient(155deg, #2b1d5c 0%, #1d1646 46%, #0f1a3d 100%); }
  .blob { position: absolute; border-radius: 50%; }

  /* ---- 玻璃面板：半透明底 + 亮描边 + 顶高光 ---- */
  .glass {
    position: absolute; border-radius: 15px;
    background: linear-gradient(160deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.06) 100%);
    border: 1px solid rgba(255,255,255,.26);
    box-shadow: 0 6px 16px rgba(6,4,20,.40), inset 0 1px 0 rgba(255,255,255,.30);
  }
  .hl { position: absolute; height: 1px; border-radius: 1px;
        background: linear-gradient(90deg, rgba(255,255,255,.60), rgba(255,255,255,0)); }
  .bar-track { position: absolute; height: 4px; border-radius: 2px; background: rgba(255,255,255,.17); }
  .bar { position: absolute; left: 0; top: 0; height: 4px; border-radius: 2px;
         background: linear-gradient(90deg, #7ef0d0, #93b6ff); }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 13px; font-weight: 700; color: #ffffff; letter-spacing: 1px; }
  .live{ font-size: 11px; color: #cbd6ff; letter-spacing: 1px; }
  .lbl { font-size: 11px; color: #d3dbf7; letter-spacing: 1px; }
  .big { font-size: 26px; font-weight: 700; color: #ffffff; }
  .val { font-size: 17px; font-weight: 700; color: #ffffff; }
  .warn   { color: #ffd166 !important; }
  .danger { color: #ff8095 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img">
    <div class="blob" style="left:0;top:0;width:180px;height:180px; background: radial-gradient(circle, rgba(150,110,255,.55) 0%, rgba(150,110,255,0) 70%);"></div>
    <div class="blob" style="left:160px;top:20px;width:160px;height:160px; background: radial-gradient(circle, rgba(90,170,255,.45) 0%, rgba(90,170,255,0) 70%);"></div>
    <div class="blob" style="left:40px;top:150px;width:140px;height:90px; background: radial-gradient(circle, rgba(255,120,200,.30) 0%, rgba(255,120,200,0) 70%);"></div>
  </div>

  <div id="render">
    <!-- 三张玻璃卡 -->
    <div class="glass" style="left:14px;top:40px;width:94px;height:96px;"></div>
    <div class="glass" style="left:113px;top:40px;width:94px;height:96px;"></div>
    <div class="glass" style="left:212px;top:40px;width:94px;height:96px;"></div>
    <div class="hl" style="left:22px;top:42px;width:78px;"></div>
    <div class="hl" style="left:121px;top:42px;width:78px;"></div>
    <div class="hl" style="left:220px;top:42px;width:78px;"></div>

    <!-- 底部玻璃条 -->
    <div class="glass" style="left:14px;top:148px;width:292px;height:60px;"></div>
    <div class="hl" style="left:24px;top:150px;width:272px;"></div>

    <div class="bar-track" style="left:24px;top:118px;width:74px;"></div>
    <div class="bar-track" style="left:123px;top:118px;width:74px;"></div>
    <div class="bar-track" style="left:222px;top:118px;width:74px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:16px;top:14px;">系统状态 SYSTEM</span>
    <span class="txt live" style="right:16px;top:15px;">实时 LIVE</span>

    <span class="txt lbl" style="left:24px;top:52px;">CPU 处理器</span>
    <span class="txt big" data-slot="cpu_load" style="left:24px;top:70px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="24,118,74,4" style="left:24px;top:118px;width:0;"></div>

    <span class="txt lbl" style="left:123px;top:52px;">内存 MEM</span>
    <span class="txt big" data-slot="mem_pct" style="left:123px;top:70px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <div class="bar" data-slot="bar2" data-kind="bar" data-from="mem_pct" data-max="100" data-box="123,118,74,4" style="left:123px;top:118px;width:0;"></div>

    <span class="txt lbl" style="left:222px;top:52px;">GPU 显卡</span>
    <span class="txt big" data-slot="gpu1_load" style="left:222px;top:70px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>
    <div class="bar" data-slot="bar3" data-kind="bar" data-from="gpu1_load" data-max="100" data-box="222,118,74,4" style="left:222px;top:118px;width:0;"></div>

    <span class="txt lbl" style="left:24px;top:158px;">网络 NET</span>
    <span class="txt val" data-slot="net1_down" style="left:24px;top:175px;" data-fmt="1" data-unit="KB/s" data-suffix=" KB/s">{{net1_down}}</span>

    <span class="txt lbl" style="left:130px;top:158px;">温度 TEMP</span>
    <span class="txt val" data-slot="cpu_temp" style="left:130px;top:176px;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>

    <span class="txt lbl" style="left:214px;top:158px;">风扇 FAN</span>
    <span class="txt val" data-slot="fan1" style="left:214px;top:176px;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>
  </div>
</div>

<script>
(function () {
  function tx(el, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var d = el.getAttribute('data-fmt');
    var s = (d === null) ? String(raw) : v.toFixed(parseInt(d, 10));
    if (el.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (el.getAttribute('data-suffix') || '');
  }
  function th(el) {
    var w = el.getAttribute('data-warn'), g = el.getAttribute('data-danger');
    if (w === null && g === null && el.getAttribute('data-from')) {
      var s = document.querySelector('[data-slot="' + el.getAttribute('data-from') + '"]');
      if (s) { w = s.getAttribute('data-warn'); g = s.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), g === null ? null : parseFloat(g)];
  }
  function cl(el, raw) {
    var v = parseFloat(raw), t = th(el);
    el.classList.toggle('warn',   t[0] !== null && v >= t[0] && !(t[1] !== null && v >= t[1]));
    el.classList.toggle('danger', t[1] !== null && v >= t[1]);
  }
  function bar(el, raw) {
    var v = parseFloat(raw), m = parseFloat(el.getAttribute('data-max') || '100');
    var b = (el.getAttribute('data-box') || '0,0,100,4').split(',');
    el.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / m)) * parseFloat(b[2])) + 'px';
    cl(el, raw);
  }
  window.__setSlot = function (name, value) {
    var sp = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].getAttribute('data-kind') === 'bar') { bar(sp[i], value); continue; }
      sp[i].textContent = tx(sp[i], value); cl(sp[i], value);
    }
    var bs = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bs.length; j++) bar(bs[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('gpu1_load', '63');
  window.__setSlot('net1_down', '12.4'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  new URLSearchParams(location.search).forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p8_glass_cards",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar2",
      "kind": "bar",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar3",
      "kind": "bar",
      "from": "gpu1_load",
      "max": 100
    },
    {
      "name": "net1_down",
      "kind": "text",
      "fmt": 1,
      "unit": "KB/s"
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
