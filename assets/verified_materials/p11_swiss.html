<!DOCTYPE html>
<!--
  P11 · 瑞士国际主义 Swiss（PC 性能监控）
  画面：严格网格 + 大留白 + 无衬线黑字。
  自身取舍：红只做规则线 / 色块这类非文字强调（亮红文字够不到对比度下限）；底色中灰 #b6bcc3（~73%）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P11 · 瑞士</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden; display: block;
    background: #b6bcc3;
    font-family: "Helvetica Neue", "Arial", "Microsoft YaHei", sans-serif;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  #img { background: #b6bcc3; }
  .sq    { position: absolute; background: #c8362c; }
  .rule  { position: absolute; height: 3px; background: #c8362c; }
  .hair  { position: absolute; height: 1px; background: #8d949c; }
  .bar-track { position: absolute; height: 4px; background: #9ba2aa; }
  .bar { position: absolute; left: 0; top: 0; height: 4px; background: #14181c; }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 21px; font-weight: 700; color: #14181c; letter-spacing: -1px; }
  .sub { font-size: 11px; color: #33393f; letter-spacing: 1px; }
  .lbl { font-size: 12px; color: #33393f; letter-spacing: 1px; }
  .big { font-size: 26px; font-weight: 700; color: #14181c; }
  .foot{ font-size: 11px; color: #33393f; }
  .fv  { font-size: 12px; font-weight: 700; color: #14181c; }
  .warn   { color: #532b00 !important; }
  .danger { color: #6f0f0a !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="sq" style="left:16px;top:15px;width:10px;height:10px;"></div>
    <div class="rule" style="left:16px;top:60px;width:288px;"></div>
    <div class="hair" style="left:16px;top:194px;width:288px;"></div>

    <div class="bar-track" style="left:214px;top:87px;width:90px;"></div>
    <div class="bar-track" style="left:214px;top:117px;width:90px;"></div>
    <div class="bar-track" style="left:214px;top:147px;width:90px;"></div>
    <div class="bar-track" style="left:214px;top:177px;width:90px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:36px;top:12px;">性能监测</span>
    <span class="txt sub" style="left:36px;top:40px;">SYSTEM PERFORMANCE · 实时采样</span>

    <span class="txt lbl" style="left:16px;top:80px;">CPU 处理器</span>
    <span class="txt big" data-slot="cpu_load" style="right:120px;top:74px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="214,87,90,4" style="left:214px;top:87px;width:0;"></div>

    <span class="txt lbl" style="left:16px;top:110px;">内存 MEMORY</span>
    <span class="txt big" data-slot="mem_pct" style="right:120px;top:104px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <div class="bar" data-slot="bar2" data-kind="bar" data-from="mem_pct" data-max="100" data-box="214,117,90,4" style="left:214px;top:117px;width:0;"></div>

    <span class="txt lbl" style="left:16px;top:140px;">磁盘 DISK</span>
    <span class="txt big" data-slot="disk1_pct" style="right:120px;top:134px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>
    <div class="bar" data-slot="bar3" data-kind="bar" data-from="disk1_pct" data-max="100" data-box="214,147,90,4" style="left:214px;top:147px;width:0;"></div>

    <span class="txt lbl" style="left:16px;top:170px;">GPU 显卡</span>
    <span class="txt big" data-slot="gpu1_load" style="right:120px;top:164px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>
    <div class="bar" data-slot="bar4" data-kind="bar" data-from="gpu1_load" data-max="100" data-box="214,177,90,4" style="left:214px;top:177px;width:0;"></div>

    <span class="txt foot" style="left:16px;top:208px;">采样 0.5s / INTERVAL</span>
    <span class="txt foot" style="left:130px;top:208px;">温度 TEMP</span>
    <span class="txt fv" data-slot="cpu_temp" style="left:188px;top:207px;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>
    <span class="txt foot" style="left:228px;top:208px;">FAN</span>
    <span class="txt fv" data-slot="fan1" data-unit="RPM" style="left:254px;top:207px;" data-fmt="0" data-suffix=" RPM">{{fan1}}</span>
  </div>
</div>

<script>
(function () {
  function tx(el, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var d = el.getAttribute('data-fmt');
    var s = (d === null) ? String(raw) : v.toFixed(parseInt(d, 10));
    if (el.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (el.getAttribute('data-suffix') || '');
  }
  function th(el) {
    var w = el.getAttribute('data-warn'), g = el.getAttribute('data-danger');
    if (w === null && g === null && el.getAttribute('data-from')) {
      var s = document.querySelector('[data-slot="' + el.getAttribute('data-from') + '"]');
      if (s) { w = s.getAttribute('data-warn'); g = s.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), g === null ? null : parseFloat(g)];
  }
  function cl(el, raw) {
    var v = parseFloat(raw), t = th(el);
    el.classList.toggle('warn',   t[0] !== null && v >= t[0] && !(t[1] !== null && v >= t[1]));
    el.classList.toggle('danger', t[1] !== null && v >= t[1]);
  }
  function bar(el, raw) {
    var v = parseFloat(raw), m = parseFloat(el.getAttribute('data-max') || '100');
    var b = (el.getAttribute('data-box') || '0,0,100,4').split(',');
    el.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / m)) * parseFloat(b[2])) + 'px';
    cl(el, raw);
  }
  window.__setSlot = function (name, value) {
    var sp = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].getAttribute('data-kind') === 'bar') { bar(sp[i], value); continue; }
      sp[i].textContent = tx(sp[i], value); cl(sp[i], value);
    }
    var bs = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bs.length; j++) bar(bs[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('disk1_pct', '55');
  window.__setSlot('gpu1_load', '63'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  new URLSearchParams(location.search).forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p11_swiss",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar2",
      "kind": "bar",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar3",
      "kind": "bar",
      "from": "disk1_pct",
      "max": 100
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar4",
      "kind": "bar",
      "from": "gpu1_load",
      "max": 100
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
