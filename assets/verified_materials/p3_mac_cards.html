<!DOCTYPE html>
<!--
  P3 · 浅灰白 macOS 风卡片（PC 性能监控）
  画面：CPU / 内存 / GPU + 磁盘 / 网络上行 / 网络下行；圆角卡 + 三色窗口点。
  自身取舍：底色用中灰而非纯白，把平均亮度压在安全区。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P3 · 活动监视器</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden;
    background: #9aa5b1;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: block;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 主题：浅灰白（macOS 风） ---- */
  #img {
    background: linear-gradient(180deg, #a7b1bc 0%, #97a2ae 100%);
  }
  .win { position: absolute; border-radius: 10px; background: #c6cfd8;
         box-shadow: 0 2px 6px rgba(31,41,55,.22); }
  .bar-title { position: absolute; border-radius: 10px 10px 0 0; background: #bcc6d0; }
  .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; }
  .card { position: absolute; border-radius: 7px; background: #d6dde4;
          box-shadow: 0 1px 2px rgba(31,41,55,.14); }
  .bar-track { position: absolute; height: 6px; border-radius: 3px; background: #b3bdc8; }
  .bar { position: absolute; left: 0; top: 0; height: 6px; border-radius: 3px;
         background: linear-gradient(90deg, #0a84ff, #4aa3ff); transition: none; }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 11px; font-weight: 700; color: #263238; }
  .lbl { font-size: 11px; color: #3f4b59; }
  .val { font-size: 21px; font-weight: 700; color: #16202b; }
  .unit{ font-size: 11px; color: #3c4d5e; }
  .sub { font-size: 11px; color: #3f4b59; }
  .warn   { color: #b45309 !important; }
  .danger { color: #c0362c !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="win" style="left:8px;top:8px;width:304px;height:224px;"></div>
    <div class="bar-title" style="left:8px;top:8px;width:304px;height:22px;"></div>
    <div class="dot" style="left:20px;top:15px;background:#ff5f57;"></div>
    <div class="dot" style="left:32px;top:15px;background:#febc2e;"></div>
    <div class="dot" style="left:44px;top:15px;background:#28c840;"></div>

    <div class="card" style="left:18px;top:38px;width:284px;height:46px;"></div>
    <div class="card" style="left:18px;top:92px;width:284px;height:46px;"></div>
    <div class="card" style="left:18px;top:146px;width:284px;height:46px;"></div>
    <div class="card" style="left:18px;top:200px;width:284px;height:22px;"></div>

    <div class="bar-track" style="left:120px;top:68px;width:170px;"></div>
    <div class="bar-track" style="left:120px;top:122px;width:170px;"></div>
    <div class="bar-track" style="left:120px;top:176px;width:170px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:58px;top:14px;">活动监视器 · Activity Monitor</span>

    <span class="txt lbl" style="left:28px;top:48px;">CPU 处理器</span>
    <span class="txt val" data-slot="cpu_load" style="left:28px;top:62px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <span class="txt unit" style="right:26px;top:50px;">使用率</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="120,68,170,6" style="left:120px;top:68px;width:0;"></div>

    <span class="txt lbl" style="left:28px;top:102px;">内存 MEM</span>
    <span class="txt val" data-slot="mem_pct" style="left:28px;top:116px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <span class="txt unit" data-slot="mem_total" data-unit="GB" data-fmt="0" data-suffix=" GB" style="right:26px;top:104px;">16 GB</span>
    <div class="bar" data-slot="bar2" data-kind="bar" data-from="mem_pct" data-max="100" data-box="120,122,170,6" style="left:120px;top:122px;width:0;"></div>

    <span class="txt lbl" style="left:28px;top:156px;">GPU 显卡</span>
    <span class="txt val" data-slot="gpu1_load" style="left:28px;top:170px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>
    <span class="txt unit" style="right:26px;top:158px;">使用率</span>
    <div class="bar" data-slot="bar3" data-kind="bar" data-from="gpu1_load" data-max="100" data-box="120,176,170,6" style="left:120px;top:176px;width:0;"></div>

    <span class="txt sub" style="left:28px;top:206px;">磁盘 DISK</span>
    <span class="txt sub" data-slot="disk1_pct" style="left:100px;top:206px;color:#16202b;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>
    <span class="txt sub" style="left:140px;top:206px;">网络 ↑</span>
    <span class="txt sub" data-slot="net1_up" data-unit="KB/s" style="left:182px;top:206px;color:#16202b;" data-fmt="1" data-suffix=" KB/s" >{{net1_up}}</span>
    <span class="txt sub" style="left:246px;top:206px;">↓</span>
    <span class="txt sub" data-slot="net1_down" data-unit="KB/s" style="left:258px;top:206px;color:#16202b;" data-fmt="1" data-suffix=" KB/s" >{{net1_down}}</span>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  function fmt(spec, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var dec = spec.getAttribute('data-fmt');
    var s = (dec === null) ? String(raw) : v.toFixed(parseInt(dec, 10));
    if (spec.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (spec.getAttribute('data-suffix') || '');
  }
  function thresholds(spec) {
    var w = spec.getAttribute('data-warn'), d = spec.getAttribute('data-danger');
    if (w === null && d === null && spec.getAttribute('data-from')) {
      var src = document.querySelector('[data-slot="' + spec.getAttribute('data-from') + '"]');
      if (src) { w = src.getAttribute('data-warn'); d = src.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), d === null ? null : parseFloat(d)];
  }
  function paint(spec, raw) {
    var v = parseFloat(raw), th = thresholds(spec);
    spec.classList.toggle('warn',   th[0] !== null && v >= th[0] && !(th[1] !== null && v >= th[1]));
    spec.classList.toggle('danger', th[1] !== null && v >= th[1]);
  }
  function setBar(spec, raw) {
    var v = parseFloat(raw), max = parseFloat(spec.getAttribute('data-max') || '100');
    var box = (spec.getAttribute('data-box') || '0,0,100,4').split(',');
    spec.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / max)) * parseFloat(box[2])) + 'px';
    paint(spec, raw);
  }
  window.__setSlot = function (name, value) {
    var specs = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < specs.length; i++) {
      var el = specs[i];
      if (el.getAttribute('data-kind') === 'bar') { setBar(el, value); continue; }
      el.textContent = fmt(el, value);
      paint(el, value);
    }
    var bars = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bars.length; j++) setBar(bars[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('gpu1_load', '63');
  window.__setSlot('disk1_pct', '55'); window.__setSlot('net1_up', '12.4'); window.__setSlot('net1_down', '88.1');
  q.forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p3_mac_cards",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "mem_total",
      "kind": "text",
      "fmt": 0,
      "unit": "GB"
    },
    {
      "name": "bar2",
      "kind": "bar",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar3",
      "kind": "bar",
      "from": "gpu1_load",
      "max": 100
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "net1_up",
      "kind": "text",
      "fmt": 1,
      "unit": "KB/s"
    },
    {
      "name": "net1_down",
      "kind": "text",
      "fmt": 1,
      "unit": "KB/s"
    }
  ]
}
</script>
</body>
</html>
