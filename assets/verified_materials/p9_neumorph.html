<!DOCTYPE html>
<!--
  P9 · 新拟物 Neumorphism（PC 性能监控）
  画面：同色系「凸起 / 凹陷」面板，无边框无描边。
  自身取舍：底色刻意压到 ~76% 平均亮度，不用纯白。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P9 · 新拟物</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden; display: block;
    background: #bcc3cc;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  /* ---- 底：中灰（平均亮度压在 ~76%） ---- */
  #img { background: linear-gradient(165deg, #c2c9d2 0%, #b4bcc6 100%); }

  /* ---- 新拟物：同色系凸起 / 凹陷，无边框无描边 ---- */
  .raised { position: absolute; border-radius: 14px; background: #bcc3cc;
            box-shadow: 5px 5px 11px rgba(112,122,137,.55),
                       -5px -5px 11px rgba(255,255,255,.78); }
  .inset  { position: absolute; border-radius: 11px; background: #b6bdc7;
            box-shadow: inset 4px 4px 8px rgba(112,122,137,.62),
                        inset -4px -4px 8px rgba(255,255,255,.72); }
  .bar { position: absolute; left: 0; top: 0; height: 12px; border-radius: 6px;
         background: linear-gradient(90deg, #4f7fb8, #6f9fd8);
         box-shadow: 1px 1px 3px rgba(90,100,115,.45); }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 13px; font-weight: 700; color: #232a35; letter-spacing: 1px; }
  .lbl { font-size: 11px; color: #333c49; letter-spacing: 1px; }
  .sm  { font-size: 11px; color: #333c49; letter-spacing: 1px; }
  .hero{ font-size: 32px; font-weight: 700; color: #232a35; }
  .val { font-size: 22px; font-weight: 700; color: #232a35; }
  .foot{ font-size: 14px; font-weight: 700; color: #232a35; }
  .warn   { color: #5f3100 !important; }
  .danger { color: #6e1616 !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="raised" style="left:14px;top:34px;width:292px;height:76px;"></div>

    <div class="raised" style="left:14px;top:118px;width:94px;height:62px;"></div>
    <div class="raised" style="left:113px;top:118px;width:94px;height:62px;"></div>
    <div class="raised" style="left:212px;top:118px;width:94px;height:62px;"></div>

    <div class="raised" style="left:14px;top:188px;width:292px;height:40px;"></div>

    <div class="inset" style="left:158px;top:66px;width:132px;height:24px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:16px;top:14px;">资源占用 RESOURCE</span>

    <span class="txt lbl" style="left:30px;top:46px;">CPU 使用率 / LOAD</span>
    <span class="txt hero" data-slot="cpu_load" style="left:30px;top:64px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="162,72,124,12" style="left:162px;top:72px;width:0;"></div>

    <span class="txt sm" style="left:26px;top:130px;">内存 MEM</span>
    <span class="txt val" data-slot="mem_pct" style="left:26px;top:146px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>

    <span class="txt sm" style="left:125px;top:130px;">磁盘 DISK</span>
    <span class="txt val" data-slot="disk1_pct" style="left:125px;top:146px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>

    <span class="txt sm" style="left:224px;top:130px;">GPU 显卡</span>
    <span class="txt val" data-slot="gpu1_load" style="left:224px;top:146px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{gpu1_load}}</span>

    <span class="txt sm" style="left:24px;top:195px;">温度 TEMP</span>
    <span class="txt foot" data-slot="cpu_temp" style="left:24px;top:209px;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>

    <span class="txt sm" style="left:123px;top:195px;">风扇 FAN</span>
    <span class="txt foot" data-slot="fan1" style="left:123px;top:209px;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>

    
    
  </div>
</div>

<script>
(function () {
  function tx(el, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var d = el.getAttribute('data-fmt');
    var s = (d === null) ? String(raw) : v.toFixed(parseInt(d, 10));
    if (el.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (el.getAttribute('data-suffix') || '');
  }
  function th(el) {
    var w = el.getAttribute('data-warn'), g = el.getAttribute('data-danger');
    if (w === null && g === null && el.getAttribute('data-from')) {
      var s = document.querySelector('[data-slot="' + el.getAttribute('data-from') + '"]');
      if (s) { w = s.getAttribute('data-warn'); g = s.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), g === null ? null : parseFloat(g)];
  }
  function cl(el, raw) {
    var v = parseFloat(raw), t = th(el);
    el.classList.toggle('warn',   t[0] !== null && v >= t[0] && !(t[1] !== null && v >= t[1]));
    el.classList.toggle('danger', t[1] !== null && v >= t[1]);
  }
  function bar(el, raw) {
    var v = parseFloat(raw), m = parseFloat(el.getAttribute('data-max') || '100');
    var b = (el.getAttribute('data-box') || '0,0,100,4').split(',');
    el.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / m)) * parseFloat(b[2])) + 'px';
    cl(el, raw);
  }
  window.__setSlot = function (name, value) {
    var sp = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].getAttribute('data-kind') === 'bar') { bar(sp[i], value); continue; }
      sp[i].textContent = tx(sp[i], value); cl(sp[i], value);
    }
    var bs = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bs.length; j++) bar(bs[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('disk1_pct', '55');
  window.__setSlot('gpu1_load', '63'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  new URLSearchParams(location.search).forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p9_neumorph",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
