<!DOCTYPE html>
<!--
  P12 · 赛博霓虹 Cyberpunk Neon（PC 性能监控）
  画面：品红 #ff5fae / 青 #00e5ff 双色霓虹 + 发光描边。
  自身取舍：霓虹色刻意提亮到能过 6:1（原味品红 #ff2e97 在这块底上只有 5.8:1）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>P12 · 赛博霓虹</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 320px; height: 240px;
    overflow: hidden; display: block;
    background: #0a0616;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #stage { position: absolute; left: 0; top: 0; width: 320px; height: 240px; overflow: hidden; }
  #img, #render, #text { position: absolute; left: 0; top: 0; width: 320px; height: 240px; }
  #img { z-index: 1; } #render { z-index: 2; } #text { z-index: 3; }

  #img { background:
           radial-gradient(ellipse at 12% 8%, rgba(255,46,151,.20) 0%, rgba(255,46,151,0) 55%),
           radial-gradient(ellipse at 92% 92%, rgba(0,229,255,.18) 0%, rgba(0,229,255,0) 55%),
           #0a0616; }
  .card { position: absolute; border-radius: 4px; background: rgba(255,46,151,.06);
          border: 1px solid #ff5fae; box-shadow: 0 0 9px rgba(255,46,151,.45),
                      inset 0 0 12px rgba(255,46,151,.12); }
  .neon { position: absolute; height: 2px; background: #00e5ff;
          box-shadow: 0 0 8px rgba(0,229,255,.85); }
  .sl   { position: absolute; width: 3px; height: 14px; background: #ff5fae;
          box-shadow: 0 0 8px rgba(255,46,151,.85); }
  .bar-track { position: absolute; height: 6px; border-radius: 3px; background: rgba(0,229,255,.14); }
  .bar { position: absolute; left: 0; top: 0; height: 6px; border-radius: 3px; background: #00e5ff;
         box-shadow: 0 0 8px rgba(0,229,255,.80); }

  .txt { position: absolute; line-height: 1; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .ttl { font-size: 13px; font-weight: 700; color: #ff5fae; letter-spacing: 2px;
         text-shadow: 0 0 8px rgba(255,46,151,.75); }
  .rec { font-size: 11px; color: #00e5ff; letter-spacing: 1px; }
  .lbl { font-size: 11px; color: #c8b8e8; letter-spacing: 1px; }
  .hero{ font-size: 30px; font-weight: 700; color: #ffffff;
         text-shadow: 0 0 10px rgba(0,229,255,.70); }
  .num { font-size: 16px; font-weight: 700; color: #ffffff; }
  .warn   { color: #ffc93c !important; text-shadow: 0 0 8px rgba(255,201,60,.70) !important; }
  .danger { color: #ff4d6d !important; text-shadow: 0 0 8px rgba(255,77,109,.70) !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="img"></div>

  <div id="render">
    <div class="neon" style="left:14px;top:34px;width:292px;"></div>
    <div class="sl" style="left:14px;top:12px;"></div>
    <div class="sl" style="left:22px;top:12px;height:8px;"></div>

    <div class="card" style="left:14px;top:46px;width:146px;height:84px;"></div>
    <div class="card" style="left:160px;top:46px;width:146px;height:84px;"></div>

    <div class="neon" style="left:14px;top:176px;width:292px;background:#ff5fae; box-shadow: 0 0 8px rgba(255,46,151,.85);"></div>

    <div class="bar-track" style="left:26px;top:116px;width:122px;"></div>
    <div class="bar-track" style="left:172px;top:116px;width:122px;"></div>
    <div class="bar-track" style="left:14px;top:158px;width:292px;"></div>
  </div>

  <div id="text">
    <span class="txt ttl" style="left:32px;top:12px;">NEON 监控台</span>
    <span class="txt rec" style="right:14px;top:13px;">实时 LIVE</span>

    <span class="txt lbl" style="left:26px;top:58px;">CPU 处理器</span>
    <span class="txt hero" data-slot="cpu_load" style="left:26px;top:74px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="75" data-danger="90">{{cpu_load}}</span>
    <div class="bar" data-slot="bar1" data-kind="bar" data-from="cpu_load" data-max="100" data-box="26,116,122,6" style="left:26px;top:116px;width:0;"></div>

    <span class="txt lbl" style="left:172px;top:58px;">内存 MEM</span>
    <span class="txt hero" data-slot="mem_pct" style="left:172px;top:74px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="80" data-danger="92">{{mem_pct}}</span>
    <div class="bar" data-slot="bar2" data-kind="bar" data-from="mem_pct" data-max="100" data-box="172,116,122,6" style="left:172px;top:116px;width:0;"></div>

    <span class="txt lbl" style="left:14px;top:140px;">磁盘 DISK</span>
    <span class="txt num" data-slot="disk1_pct" style="right:14px;top:138px;" data-fmt="0" data-unit="%" data-suffix="%" data-warn="85">{{disk1_pct}}</span>
    <div class="bar" data-slot="bar3" data-kind="bar" data-from="disk1_pct" data-max="100" data-box="14,158,292,6" style="left:14px;top:158px;width:0;"></div>

    <span class="txt lbl" style="left:14px;top:190px;">GPU 显卡</span>
    <span class="txt num" data-slot="gpu1_load" style="left:14px;top:206px;" data-fmt="0" data-unit="%" data-suffix="%">{{gpu1_load}}</span>

    <span class="txt lbl" style="left:112px;top:190px;">温度 TEMP</span>
    <span class="txt num" data-slot="cpu_temp" style="left:112px;top:206px;" data-fmt="0" data-unit="℃" data-suffix="℃" data-warn="72" data-danger="85">{{cpu_temp}}</span>

    <span class="txt lbl" style="left:210px;top:190px;">风扇 FAN</span>
    <span class="txt num" data-slot="fan1" style="left:210px;top:206px;" data-fmt="0" data-unit="RPM" data-suffix=" RPM">{{fan1}}</span>
  </div>
</div>

<script>
(function () {
  function tx(el, raw) {
    var v = parseFloat(raw);
    if (isNaN(v)) return String(raw);
    var d = el.getAttribute('data-fmt');
    var s = (d === null) ? String(raw) : v.toFixed(parseInt(d, 10));
    if (el.getAttribute('data-group') === '1') s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return s + (el.getAttribute('data-suffix') || '');
  }
  function th(el) {
    var w = el.getAttribute('data-warn'), g = el.getAttribute('data-danger');
    if (w === null && g === null && el.getAttribute('data-from')) {
      var s = document.querySelector('[data-slot="' + el.getAttribute('data-from') + '"]');
      if (s) { w = s.getAttribute('data-warn'); g = s.getAttribute('data-danger'); }
    }
    return [w === null ? null : parseFloat(w), g === null ? null : parseFloat(g)];
  }
  function cl(el, raw) {
    var v = parseFloat(raw), t = th(el);
    el.classList.toggle('warn',   t[0] !== null && v >= t[0] && !(t[1] !== null && v >= t[1]));
    el.classList.toggle('danger', t[1] !== null && v >= t[1]);
  }
  function bar(el, raw) {
    var v = parseFloat(raw), m = parseFloat(el.getAttribute('data-max') || '100');
    var b = (el.getAttribute('data-box') || '0,0,100,4').split(',');
    el.style.width = Math.round(Math.max(0, Math.min(1, (isNaN(v) ? 0 : v) / m)) * parseFloat(b[2])) + 'px';
    cl(el, raw);
  }
  window.__setSlot = function (name, value) {
    var sp = document.querySelectorAll('[data-slot="' + name + '"]');
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].getAttribute('data-kind') === 'bar') { bar(sp[i], value); continue; }
      sp[i].textContent = tx(sp[i], value); cl(sp[i], value);
    }
    var bs = document.querySelectorAll('[data-kind="bar"][data-from="' + name + '"]');
    for (var j = 0; j < bs.length; j++) bar(bs[j], value);
    return true;
  };
  window.__setSlot('cpu_load', '42'); window.__setSlot('mem_pct', '61'); window.__setSlot('disk1_pct', '55');
  window.__setSlot('gpu1_load', '63'); window.__setSlot('cpu_temp', '58'); window.__setSlot('fan1', '1420');
  new URLSearchParams(location.search).forEach(function (v, k) { window.__setSlot(k, v); });
})();
</script>
<script type="application/json" id="material-manifest">
{
  "schema": "rgb565-panel-material/1",
  "name": "p12_cyber_neon",
  "size": [
    320,
    240
  ],
  "background": "css",
  "slots": [
    {
      "name": "cpu_load",
      "kind": "text",
      "warn": 75,
      "danger": 90,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar1",
      "kind": "bar",
      "from": "cpu_load",
      "max": 100
    },
    {
      "name": "mem_pct",
      "kind": "text",
      "warn": 80,
      "danger": 92,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar2",
      "kind": "bar",
      "from": "mem_pct",
      "max": 100
    },
    {
      "name": "disk1_pct",
      "kind": "text",
      "warn": 85,
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "bar3",
      "kind": "bar",
      "from": "disk1_pct",
      "max": 100
    },
    {
      "name": "gpu1_load",
      "kind": "text",
      "fmt": 0,
      "unit": "%"
    },
    {
      "name": "cpu_temp",
      "kind": "text",
      "warn": 72,
      "danger": 85,
      "fmt": 0,
      "unit": "℃"
    },
    {
      "name": "fan1",
      "kind": "text",
      "fmt": 0,
      "unit": "RPM"
    }
  ]
}
</script>
</body>
</html>
